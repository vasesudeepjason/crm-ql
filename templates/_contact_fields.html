{# Fields for adding a contact to a company. Shared by the lead and company pages. #}
<div class="rc-grid">
  <label class="rc-field"><span>Name *</span><input type="text" name="name" placeholder="Full name" required></label>
  <label class="rc-field"><span>Designation</span><input type="text" name="designation" placeholder="e.g. Procurement Manager"></label>
  <label class="rc-field"><span>Phone</span><input type="tel" name="phone" placeholder="Phone number"></label>
  <label class="rc-field"><span>Alternate phone</span><input type="tel" name="alternate_phone" placeholder="Second phone number"></label>
  <label class="rc-field"><span>Email</span><input type="email" name="email" placeholder="name@company.com"></label>
  <label class="rc-field"><span>LinkedIn</span><input type="text" name="linkedin" placeholder="linkedin.com/in/…"></label>
  <label class="rc-check is-wide"><input type="checkbox" name="is_primary" value="1"> Primary contact</label>
  <label class="rc-field is-wide"><span>Notes</span><textarea name="notes" rows="2" placeholder="Add a note"></textarea></label>
</div>
