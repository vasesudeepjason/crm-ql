<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="turbo-visit-control" content="reload">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<title>{% block title %}Lead Desk{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="48x48">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='app.webmanifest') }}">
<meta name="application-name" content="Quantumloop CRM">
<script>
(function () {
  try {
    var saved = localStorage.getItem('leaddesk-theme');
    document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=29">
<link rel="stylesheet" href="{{ url_for('static', filename='interface.css') }}?v=17">
<link rel="stylesheet" href="{{ url_for('static', filename='auth-gradient.css') }}?v=9">
</head>
<body>
<div class="auth-shell has-gradient">
  <div class="ag" aria-hidden="true">
    <div class="ag-gradients">
      <div class="ag-blob ag-first"></div>
      <div class="ag-blob ag-second"></div>
      <div class="ag-blob ag-third"></div>
      <div class="ag-blob ag-fourth"></div>
      <div class="ag-blob ag-fifth"></div>
      <div class="ag-wander"></div>
    </div>
  </div>
  <div class="auth-card">
    <button type="button" class="theme-toggle theme-toggle-auth" id="themeToggle" aria-label="Switch between light and dark mode">
      <span class="theme-toggle-icon theme-toggle-icon-sun">☀</span>
      <span class="theme-toggle-icon theme-toggle-icon-moon">☾</span>
    </button>
    <div class="logo-slot auth-logo">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="Company logo" class="company-logo company-logo-light" onerror="this.style.display='none'">
      <img src="{{ url_for('static', filename='logo-light.svg') }}?v=2" alt="Company logo" class="company-logo company-logo-dark" onerror="this.style.display='none'">
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script>
(function () {
  var themeBtn = document.getElementById('themeToggle');
  if (!themeBtn) return;
  themeBtn.addEventListener('click', function () {
    var root = document.documentElement;
    var isLight = root.getAttribute('data-theme') === 'light';
    var next = isLight ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('leaddesk-theme', next); } catch (e) {}
  });
})();
</script>
<script src="{{ url_for('static', filename='auth-gradient.js') }}?v=4"></script>
</body>
</html>
