<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Lead Desk{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="48x48">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="turbo-cache-control" content="no-cache">
<meta name="turbo-prefetch" content="false">
<meta name="turbo-refresh-scroll" content="preserve">
<meta name="crm-account" content="{{ current_user.id }}-{{ current_user.role }}" data-turbo-track="reload">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" data-turbo-track="reload">
<script>
// Applied before the stylesheet loads, so there's no flash of the wrong theme.
(function () {
  try {
    var saved = localStorage.getItem('leaddesk-theme');
    document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=27" data-turbo-track="reload">
<link rel="stylesheet" href="{{ url_for('static', filename='navigation.css') }}?v=5" data-turbo-track="reload">
<link rel="stylesheet" href="{{ url_for('static', filename='interface.css') }}?v=16" data-turbo-track="reload">
<link rel="stylesheet" href="{{ url_for('static', filename='live.css') }}?v=1" data-turbo-track="reload">
{% block page_styles %}{% endblock %}
<script src="{{ url_for('static', filename='vendor/turbo-8.0.23/turbo.es2017-esm.js') }}" type="module" data-turbo-track="reload"></script>
<script src="{{ url_for('static', filename='navigation.js') }}?v=3" defer data-turbo-track="reload"></script>
<script src="{{ url_for('static', filename='reminder-notice.js') }}?v=2" defer></script>
<script src="{{ url_for('static', filename='live.js') }}?v=3" defer data-turbo-track="reload"></script>
</head>
<body>
<div class="shell crm-shell">
  <div class="mobile-topbar">
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
      <span class="live-badge is-rail" data-live-badge="all" aria-label="{{ live_counts.all }} unread"{% if not live_counts.all %} hidden{% endif %}>{{ live_counts.all }}</span>
    </button>
    <span class="mobile-topbar-title">Lead Desk</span>
    <a href="{{ url_for('add_lead') }}" class="mobile-topbar-add" aria-label="Add lead">+</a>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  {% include "_navigation.html" %}

  <main tabindex="-1" class="content {% block main_class %}{% endblock %}">
    <div class="due-notice" data-reminders-url="{{ url_for('due_reminders') }}" aria-live="polite"><a hidden></a></div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
<div id="live-toasts" class="live-toasts" data-turbo-permanent role="region" aria-label="Notifications" aria-live="polite"
     data-user="{{ current_user.id }}" data-state-url="{{ url_for('live_state') }}" data-socket-url="{{ '/live/socket' if live_socket_enabled else '' }}"
     data-chat-url="{{ url_for('chat') }}" data-task-url="{{ url_for('tasks_list') }}"></div>

</body>
</html>
