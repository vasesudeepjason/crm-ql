{% extends "base.html" %}{% block title %}Invoice Settings · Lead Desk{% endblock %}{% block content %}
<div class="page-header"><div><h1 class="page-title">Invoice settings</h1><p class="page-sub">Your default seller, bank and invoice details. These can be changed anytime.</p></div></div>
<form class="form-card invoice-settings" method="post">
<h2 class="section-title">Your company</h2><div class="form-row"><div class="form-group"><label>Company name</label><input name="name" placeholder="Registered company name" value="{{ settings.name or '' }}" required></div><div class="form-group"><label>Invoice prefix</label><input name="invoice_prefix" placeholder="e.g. QL" value="{{ settings.invoice_prefix or 'QL' }}"></div></div>
<div class="form-group"><label>Registered address</label><textarea name="address_lines" placeholder="Street, city and postal code">{{ settings.address_lines or '' }}</textarea></div>
<div class="form-row"><div class="form-group"><label>GSTIN</label><input name="gstin" placeholder="15-character GSTIN" value="{{ settings.gstin or '' }}"></div><div class="form-group"><label>PAN</label><input name="pan" placeholder="10-character PAN" value="{{ settings.pan or '' }}"></div></div><div class="form-group"><label>Website</label><input name="website" placeholder="company.com" value="{{ settings.website or '' }}"></div>
<h2 class="section-title">Bank details</h2><div class="form-row"><div class="form-group"><label>Account name</label><input name="bank_name" placeholder="Account holder name" value="{{ settings.bank_name or '' }}"></div><div class="form-group"><label>IFSC</label><input name="ifsc" placeholder="11-character IFSC" value="{{ settings.ifsc or '' }}"></div></div><div class="form-row"><div class="form-group"><label>Account number</label><input name="account_no" placeholder="Bank account number" value="{{ settings.account_no or '' }}"></div><div class="form-group"><label>Bank / branch</label><input name="bank_branch" placeholder="Bank and branch" value="{{ settings.bank_branch or '' }}"></div></div><div class="form-group"><label>UPI ID</label><input name="upi_id" placeholder="name@bank" value="{{ settings.upi_id or '' }}"></div>
<h2 class="section-title">Defaults</h2><div class="form-group"><label>Default notes</label><textarea name="default_notes" placeholder="Notes to include on new invoices">{{ settings.default_notes or '' }}</textarea></div><div class="form-group"><label>Default terms (one per line)</label><textarea name="default_terms" placeholder="Enter one term per line" rows="8">{{ settings.default_terms or '' }}</textarea></div><button class="btn btn-accent">Save settings</button>
</form>{% endblock %}
