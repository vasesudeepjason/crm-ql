{% extends "base.html" %}
{% block title %}Schedule task · Lead Desk{% endblock %}
{% block content %}
<header class="page-header"><div><h1 class="page-title">{{ 'Edit task' if editing else 'Schedule task' }}</h1></div></header>
<form class="form-card planning-form" method="post">
  <div class="form-group"><label for="title">Task name</label><input id="title" name="title" placeholder="e.g. Review the proposal" value="{{ values.get('title','') }}" required></div>
  <div class="form-row">
    <div class="form-group"><label for="project">Project</label><select id="project" name="project" required{% if editing %} disabled{% endif %}>{% for p in projects %}<option value="{{ p.id }}"{% if p.id == selected %} selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
    <div class="form-group"><label for="assignee">Assignee</label><select id="assignee" name="assignee_id"><option value="">Unassigned</option>{% for person in users %}<option value="{{ person.id }}"{% if values.get('assignee_id')|int == person.id %} selected{% endif %}>{{ person.name }}</option>{% endfor %}</select></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label for="start">Start date</label><input id="start" type="date" name="start_date" value="{{ values.get('start_date') or '' }}"></div>
    <div class="form-group"><label for="due">Due date</label><input id="due" type="date" name="due_date" value="{{ values.get('due_date') or '' }}"></div>
  </div>
  <div class="form-group"><label for="priority">Priority</label><select id="priority" name="priority">{% for priority in priorities %}<option{% if priority == values.get('priority','Medium') %} selected{% endif %}>{{ priority }}</option>{% endfor %}</select></div>
  <div class="form-group"><label for="description">Details</label><textarea id="description" name="description" placeholder="What needs to be done?" rows="3">{{ values.get('description') or '' }}</textarea></div>
  <div class="planning-actions"><button class="btn btn-primary">Save task</button><a href="{{ url_for('team_planner') }}">Cancel</a></div>
</form>
{% endblock %}
